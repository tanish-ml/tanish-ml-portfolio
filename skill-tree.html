<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Skill Tree | Tanish Mittal</title>
    <meta
      name="description"
      content="Explore Tanish Mittal's skills in Machine Learning, Deep Learning, and Data Engineering through an interactive 3D node network."
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+New:wght@400;700&family=Inter:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- 3D Force Graph Library -->
    <script src="https://unpkg.com/3d-force-graph"></script>

    <style>
      :root {
        --bg: #010302;
        --text: #ffffff;
        --accent: #00ffcc;
      }
      body {
        margin: 0;
        background-color: var(--bg);
        color: var(--text);
        font-family: "Inter", sans-serif;
        overflow: hidden;
      }
      #3d-graph {
        width: 100vw;
        height: 100vh;
        cursor: crosshair;
        background: radial-gradient(circle at center, #05100a 0%, #000000 100%);
      }
      #3d-graph:active {
        cursor: grabbing;
      }

      /* Overlay UI */
      .ui-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 2rem;
      }
      .ui-header,
      .ui-footer,
      #terminal-popup {
        pointer-events: auto;
      }

      h1 {
        font-family: "Courier New", monospace;
        color: var(--accent);
        font-size: clamp(1.2rem, 3vw, 2rem);
        text-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        margin: 0;
      }
      p.subtitle {
        font-family: "Courier New", monospace;
        color: #00aa44;
        margin-top: 0.5rem;
        font-size: clamp(0.8rem, 2vw, 1rem);
      }

      /* Terminal Popup */
      #terminal-popup {
        position: absolute;
        bottom: 2rem;
        right: 2rem;
        width: 400px;
        max-width: calc(100vw - 4rem);
        background: rgba(0, 10, 3, 0.9);
        border: 1px solid rgba(0, 255, 204, 0.4);
        border-left: 4px solid #ff0055;
        padding: 1.5rem;
        backdrop-filter: blur(12px);
        box-shadow: 0 0 30px rgba(0, 255, 204, 0.1);
        transform: translateY(150%);
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        font-family: "Courier New", monospace;
      }
      #terminal-popup.visible {
        transform: translateY(0);
      }
      #terminal-title {
        color: #ff0055;
        font-size: 1.4rem;
        font-weight: bold;
        margin-bottom: 0.5rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
      }
      #terminal-desc {
        color: #e0e0e0;
        font-size: 0.95rem;
        line-height: 1.5;
      }

      @media (max-width: 768px) {
        .ui-overlay {
          padding: 1rem;
        }
        #terminal-popup {
          bottom: 1rem;
          right: 1rem;
          width: calc(100vw - 2rem);
          max-width: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="3d-graph" aria-hidden="true"></div>

    <div class="ui-overlay">
      <div class="ui-header flex justify-between items-start">
        <div>
          <h1>> /sys/skill_tree.exe</h1>
          <p class="subtitle">Click nodes to expand deep network layers.</p>
        </div>
        <a
          href="index.html"
          class="text-[var(--accent)] hover:text-[#ff0055] transition font-mono whitespace-nowrap bg-black/50 px-4 py-2 border border-[var(--accent)]/30 rounded backdrop-blur-md text-sm md:text-base"
        >
          <i class="fas fa-arrow-left mr-2"></i>MAIN_FRAME
        </a>
      </div>

      <div id="terminal-popup">
        <div id="terminal-title">AWAITING INPUT</div>
        <div id="terminal-desc">
          Select a node from the network to view detailed telemetry.
        </div>
      </div>
    </div>

    <script>
      // --- PROPER MULTILEVEL HIERARCHICAL SKILL TREE DATA ---
      const rootData = {
        id: "Tanish Mittal",
        desc: "Core System. Architecting Intelligence at the Edge.",
        color: "#ffffff",
        val: 30,
        children: [
          {
            id: "Artificial Intelligence",
            desc: "The core computational brain. Neural networks and classical learning.",
            color: "#ff0055", // Neon Pink
            val: 22,
            children: [
              {
                id: "Deep Learning",
                desc: "High-dimensional neural architectures.",
                color: "#ff3377",
                val: 18,
                children: [
                  {
                    id: "PyTorch",
                    desc: "Advanced tensor computation and dynamic neural networks.",
                    color: "#ff6699",
                    val: 14,
                  },
                  {
                    id: "Computer Vision",
                    desc: "Giving machines the ability to see and parse visual data.",
                    color: "#ff3377",
                    val: 16,
                    children: [
                      {
                        id: "CNN",
                        desc: "Convolutional Neural Networks for spatial feature extraction.",
                        color: "#ff6699",
                        val: 12,
                      },
                    ],
                  },
                  {
                    id: "NLP",
                    desc: "Natural Language Processing. Teaching machines to read and generate text.",
                    color: "#ff3377",
                    val: 16,
                    children: [
                      {
                        id: "Transformers",
                        desc: "Attention is all you need. State-of-the-art sequence models.",
                        color: "#ff6699",
                        val: 12,
                      },
                      {
                        id: "RNN",
                        desc: "Recurrent Neural Networks for temporal and sequential data.",
                        color: "#ff6699",
                        val: 12,
                      },
                    ],
                  },
                ],
              },
              {
                id: "Machine Learning",
                desc: "Classical predictive modeling and statistical inference.",
                color: "#ff1166",
                val: 18,
                children: [
                  {
                    id: "Scikit-Learn",
                    desc: "The standard library for baseline models and clustering.",
                    color: "#ff4488",
                    val: 14,
                  },
                  {
                    id: "Federated Learning",
                    desc: "Decentralized, privacy-preserving AI trained across edge devices.",
                    color: "#ff4488",
                    val: 14,
                  },
                ],
              },
            ],
          },
          {
            id: "Data Systems",
            desc: "The circulatory system. Pipelines, processing, and persistence.",
            color: "#0055ff", // Electric Blue
            val: 22,
            children: [
              {
                id: "Databases",
                desc: "High-performance storage architectures.",
                color: "#3377ff",
                val: 18,
                children: [
                  {
                    id: "SQL",
                    desc: "Relational data structuring and complex querying.",
                    color: "#6699ff",
                    val: 14,
                  },
                  {
                    id: "MongoDB",
                    desc: "NoSQL document storage for unstructured data.",
                    color: "#6699ff",
                    val: 14,
                  },
                  {
                    id: "Redis",
                    desc: "In-memory data structure store for extreme speed caching.",

                    val: 14,
                  },
                  {
                    id: "Influx",
                    desc: "Time-series database built for high-frequency telemetry.",
                    color: "#6699ff",
                    val: 14,
                  },
                ],
              },
              {
                id: "Data Processing",
                desc: "Wrangling and streaming massive datasets.",
                color: "#3377ff",
                val: 18,
                children: [
                  {
                    id: "Pandas & NumPy",
                    desc: "Vectorized matrix operations and data manipulation.",
                    color: "#6699ff",
                    val: 14,
                  },
                  {
                    id: "Kafka",
                    desc: "High-throughput distributed event streaming platform.",
                    color: "#6699ff",
                    val: 14,
                  },
                  {
                    id: "MQTT",
                    desc: "Lightweight messaging protocol optimized for IoT and Edge devices.",
                    color: "#6699ff",
                    val: 14,
                  },
                ],
              },
            ],
          },
          {
            id: "Software & Web",
            desc: "The interface. Bridging complex models to human interaction.",
            color: "#00ffcc", // Neon Cyan
            val: 22,
            children: [
              {
                id: "Backend APIs",
                desc: "Serving ML models to the web securely and rapidly.",
                color: "#33ffdd",
                val: 18,
                children: [
                  {
                    id: "Flask & FastAPI",
                    desc: "High-performance Python routing and inference serving.",
                    color: "#66ffee",
                    val: 14,
                  },
                  {
                    id: "Firebase",
                    desc: "Real-time backend-as-a-service and authentication.",
                    color: "#66ffee",
                    val: 14,
                  },
                ],
              },
              {
                id: "Frontend",
                desc: "User-facing architecture and visualizations.",
                color: "#33ffdd",
                val: 18,
                children: [
                  {
                    id: "WebDev",
                    desc: "HTML, CSS, JavaScript, and modern WebGL.",
                    color: "#66ffee",
                    val: 14,
                  },
                  {
                    id: "Streamlit",
                    desc: "Rapid dashboarding and data-app prototyping.",
                    color: "#66ffee",
                    val: 14,
                  },
                  {
                    id: "UI/UX",
                    desc: "Designing intuitive, cyberpunk-inspired user experiences.",
                    color: "#66ffee",
                    val: 14,
                  },
                ],
              },
            ],
          },
          {
            id: "DevOps & Cloud",
            desc: "The infrastructure. Scalability and version control.",
            color: "#ffaa00", // Bright Orange/Yellow
            val: 22,
            children: [
              {
                id: "AWS",
                desc: "Amazon Web Services. Cloud compute, S3, and scalable ML deployment.",
                color: "#ffbb33",
                val: 16,
              },
              {
                id: "Docker",
                desc: "Containerizing environments to ensure 'it works on my machine' works everywhere.",
                color: "#ffbb33",
                val: 16,
              },
              {
                id: "Git",
                desc: "Distributed version control and collaborative repository management.",
                color: "#ffbb33",
                val: 16,
              },
            ],
          },
        ],
      };

      // --- GRAPH LOGIC ---
      const nodesById = {};
      const links = [];

      function traverseTree(node, parent = null) {
        const n = {
          id: node.id,
          desc: node.desc,
          color: node.color,
          val: node.val,
          // Collapse deeply nested nodes initially. Show Root + Level 1.
          collapsed: parent !== null,
          childLinks: [],
        };
        nodesById[node.id] = n;

        if (node.children) {
          node.children.forEach((child) => {
            traverseTree(child, n);
            const link = { source: n.id, target: child.id };
            n.childLinks.push(link);
          });
        }
      }

      traverseTree(rootData);

      function getPrunedTree() {
        const visibleNodes = [];
        const visibleLinks = [];

        function traverseVisible(nodeId) {
          const node = nodesById[nodeId];
          if (!node) return;
          visibleNodes.push(node);

          if (!node.collapsed && node.childLinks) {
            node.childLinks.forEach((link) => {
              visibleLinks.push(link);
              traverseVisible(link.target.id || link.target);
            });
          }
        }

        traverseVisible(rootData.id);
        return { nodes: visibleNodes, links: visibleLinks };
      }

      // Initialize Graph with "Radial Out" hierarchical layout
      const elem = document.getElementById("3d-graph");
      const Graph = ForceGraph3D()(elem)
        .backgroundColor("rgba(0,0,0,0)") // Let CSS gradient show
        .dagMode("radialout") // Strict tree structure! Looks incredibly pro.
        .dagLevelDistance(80) // Space out the levels
        .nodeColor("color")
        .nodeRelSize(5)
        .nodeVal("val")
        .nodeLabel("id")
        .nodeResolution(16) // Smoother spheres
        .linkWidth(2)
        .linkColor(() => "rgba(0, 255, 204, 0.4)")
        .linkDirectionalParticles(3)
        .linkDirectionalParticleWidth(2.5)
        .linkDirectionalParticleSpeed(0.008)
        .onNodeClick((node) => {
          // Toggle collapse state
          if (node.childLinks.length > 0) {
            node.collapsed = !node.collapsed;
            Graph.graphData(getPrunedTree());
          }

          // Aim camera at node
          const distance = 180;
          const distRatio = 1 + distance / Math.hypot(node.x, node.y, node.z);
          Graph.cameraPosition(
            {
              x: node.x * distRatio,
              y: node.y * distRatio,
              z: node.z * distRatio,
            },
            node,
            1500, // Smooth fly
          );

          // Update UI Terminal
          const terminal = document.getElementById("terminal-popup");
          document.getElementById("terminal-title").innerText = "> " + node.id;
          document.getElementById("terminal-desc").innerText = node.desc;
          terminal.style.borderColor = node.color;
          terminal.style.borderLeftColor = node.color;
          document.getElementById("terminal-title").style.color = node.color;
          document.getElementById("terminal-title").style.textShadow =
            `0 0 10px ${node.color}80`;

          terminal.classList.add("visible");
        });

      // Initial render
      Graph.graphData(getPrunedTree());

      // Auto-rotate the graph slightly like a glowing core
      let angle = 0;
      setInterval(() => {
        angle += Math.PI / 2000;
        Graph.cameraPosition({
          x: 400 * Math.sin(angle),
          z: 400 * Math.cos(angle),
        });
      }, 20);

      window.addEventListener("resize", () => {
        Graph.width(window.innerWidth);
        Graph.height(window.innerHeight);
      });

      Graph.onBackgroundClick(() => {
        document.getElementById("terminal-popup").classList.remove("visible");
      });
    </script>
  </body>
</html>
