<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Skill Tree | Tanish Mittal</title>
    <meta
      name="description"
      content="Explore Tanish Mittal's skills in Machine Learning, Deep Learning, and Data Engineering through an interactive 2D node network."
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+New:wght@400;700&family=Inter:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- D3.js Library -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>
      :root {
        --bg: #010302;
        --text: #ffffff;
        --accent: #00ffcc;
      }
      body {
        margin: 0;
        background-color: var(--bg);
        color: var(--text);
        font-family: "Inter", sans-serif;
        overflow: hidden; /* Prevent native scroll, D3 handles panning */
      }
      #tree-container {
        width: 100vw;
        height: 100vh;
        cursor: grab;
        background: radial-gradient(circle at center, #05100a 0%, #000000 100%);
      }
      #tree-container:active {
        cursor: grabbing;
      }

      /* SVG Styling for Cyberpunk D3 Tree */
      .node circle {
        cursor: pointer;
        stroke-width: 2px;
        transition: filter 0.3s ease;
      }
      .node circle:hover {
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8));
      }
      .node text {
        font-family: "Courier New", monospace;
        font-size: 14px;
        fill: #e0e0e0;
        text-shadow:
          0 0 8px rgba(0, 0, 0, 1),
          0 0 3px rgba(0, 0, 0, 1);
        pointer-events: none;
      }
      .link {
        fill: none;
        stroke-width: 1.5px;
        opacity: 0.6;
      }

      /* Overlay UI */
      .ui-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 2rem;
      }
      .ui-header,
      #terminal-popup {
        pointer-events: auto;
      }

      h1 {
        font-family: "Courier New", monospace;
        color: var(--accent);
        font-size: clamp(1.2rem, 3vw, 2rem);
        text-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        margin: 0;
      }
      p.subtitle {
        font-family: "Courier New", monospace;
        color: #00aa44;
        margin-top: 0.5rem;
        font-size: clamp(0.8rem, 2vw, 1rem);
      }

      /* Terminal Popup */
      #terminal-popup {
        position: absolute;
        bottom: 2rem;
        right: 2rem;
        width: 400px;
        max-width: calc(100vw - 4rem);
        background: rgba(0, 10, 3, 0.9);
        border: 1px solid rgba(0, 255, 204, 0.4);
        border-left: 4px solid #ff0055;
        padding: 1.5rem;
        backdrop-filter: blur(12px);
        box-shadow: 0 0 30px rgba(0, 255, 204, 0.1);
        transform: translateY(150%);
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        font-family: "Courier New", monospace;
      }
      #terminal-popup.visible {
        transform: translateY(0);
      }
      #terminal-title {
        color: #ff0055;
        font-size: 1.4rem;
        font-weight: bold;
        margin-bottom: 0.5rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
      }
      #terminal-desc {
        color: #e0e0e0;
        font-size: 0.95rem;
        line-height: 1.5;
      }

      /* Minimap / Navigation Helper */
      #nav-helper {
        position: absolute;
        bottom: 2rem;
        left: 2rem;
        color: rgba(255, 255, 255, 0.5);
        font-family: "Courier New", monospace;
        font-size: 0.8rem;
        pointer-events: none;
      }

      @media (max-width: 768px) {
        .ui-overlay {
          padding: 1rem;
        }
        #terminal-popup {
          bottom: 1rem;
          right: 1rem;
          width: calc(100vw - 2rem);
        }
        #nav-helper {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- 2D SVG Canvas Container -->
    <div id="tree-container"></div>

    <div class="ui-overlay">
      <div class="ui-header flex justify-between items-start">
        <div>
          <h1>> /sys/skill_tree.exe</h1>
          <p class="subtitle">
            Click nodes to expand branches. Drag to pan. Scroll to zoom.
          </p>
        </div>
        <a
          href="index.html"
          class="text-[var(--accent)] hover:text-[#ff0055] transition font-mono whitespace-nowrap bg-black/50 px-4 py-2 border border-[var(--accent)]/30 rounded backdrop-blur-md text-sm md:text-base"
        >
          <i class="fas fa-arrow-left mr-2"></i>MAIN_FRAME
        </a>
      </div>

      <div id="nav-helper">
        > Mouse Scroll: Zoom<br />
        > Click & Drag: Pan Camera<br />
        > Node Click: Expand / Collapse branch
      </div>

      <div id="terminal-popup">
        <div id="terminal-title">AWAITING INPUT</div>
        <div id="terminal-desc">
          Select a node from the network to view detailed telemetry.
        </div>
      </div>
    </div>

    <script>
      // --- STRUCTURED D3 DATA ---
      const treeData = {
        name: "Tanish Mittal",
        desc: "Core System. Architecting Intelligence at the Edge.",
        color: "#ffffff",
        children: [
          {
            name: "Technical Skills",
            desc: "The engineering core. High-performance software and AI systems.",
            color: "#00ffcc",
            children: [
              {
                name: "Artificial Intelligence",
                desc: "The computational brain. Neural networks and classical learning.",
                color: "#ff0055",
                children: [
                  {
                    name: "Deep Learning",
                    desc: "High-dimensional neural architectures.",
                    color: "#ff3377",
                    children: [
                      {
                        name: "PyTorch",
                        desc: "Advanced tensor computation and dynamic neural networks.",
                        color: "#ff6699",
                      },
                      {
                        name: "Computer Vision",
                        desc: "Giving machines the ability to see and parse visual data.",
                        color: "#ff6699",
                        children: [
                          {
                            name: "CNN",
                            desc: "Convolutional Neural Networks for spatial feature extraction.",
                            color: "#ff99bb",
                          },
                        ],
                      },
                      {
                        name: "NLP",
                        desc: "Natural Language Processing. Teaching machines to read and generate text.",
                        color: "#ff6699",
                        children: [
                          {
                            name: "Transformers",
                            desc: "Attention is all you need. State-of-the-art sequence models.",
                            color: "#ff99bb",
                          },
                          {
                            name: "RNN",
                            desc: "Recurrent Neural Networks for temporal and sequential data.",
                            color: "#ff99bb",
                          },
                        ],
                      },
                    ],
                  },
                  {
                    name: "Machine Learning",
                    desc: "Classical predictive modeling and statistical inference.",
                    color: "#ff3377",
                    children: [
                      {
                        name: "Scikit-Learn",
                        desc: "The standard library for baseline models and clustering.",
                        color: "#ff6699",
                      },
                      {
                        name: "Federated Learning",
                        desc: "Decentralized, privacy-preserving AI trained across edge devices.",
                        color: "#ff6699",
                      },
                    ],
                  },
                ],
              },
              {
                name: "Data Systems",
                desc: "The circulatory system. Pipelines, processing, and persistence.",
                color: "#0055ff",
                children: [
                  {
                    name: "Databases",
                    desc: "High-performance storage architectures.",
                    color: "#3377ff",
                    children: [
                      {
                        name: "SQL",
                        desc: "Relational data structuring and complex querying.",
                        color: "#6699ff",
                      },
                      {
                        name: "MongoDB",
                        desc: "NoSQL document storage for unstructured data.",
                        color: "#6699ff",
                      },
                      {
                        name: "Redis",
                        desc: "In-memory data structure store for extreme speed caching.",
                        color: "#6699ff",
                      },
                      {
                        name: "Influx",
                        desc: "Time-series database built for high-frequency telemetry.",
                        color: "#6699ff",
                      },
                    ],
                  },
                  {
                    name: "Data Processing",
                    desc: "Wrangling and streaming massive datasets.",
                    color: "#3377ff",
                    children: [
                      {
                        name: "Pandas & NumPy",
                        desc: "Vectorized matrix operations and data manipulation.",
                        color: "#6699ff",
                      },
                      {
                        name: "Kafka",
                        desc: "High-throughput distributed event streaming platform.",
                        color: "#6699ff",
                      },
                      {
                        name: "MQTT",
                        desc: "Lightweight messaging protocol optimized for IoT and Edge devices.",
                        color: "#6699ff",
                      },
                    ],
                  },
                ],
              },
              {
                name: "System Design",
                desc: "Architecting scalable, resilient, and highly available backends.",
                color: "#aa00ff",
                children: [
                  {
                    name: "Microservices",
                    desc: "Decoupling monolithic architectures into independent, scalable services.",
                    color: "#cc66ff",
                  },
                  {
                    name: "Distributed Systems",
                    desc: "Designing for fault tolerance, consensus, and horizontal scaling.",
                    color: "#cc66ff",
                  },
                  {
                    name: "Load Balancing",
                    desc: "Efficiently routing traffic across multiple server instances.",
                    color: "#cc66ff",
                  },
                  {
                    name: "API Gateways",
                    desc: "Managing authentication, rate limiting, and routing for external clients.",
                    color: "#cc66ff",
                  },
                ],
              },
              {
                name: "Software & Web",
                desc: "The interface. Bridging complex models to human interaction.",
                color: "#00ffcc",
                children: [
                  {
                    name: "Backend APIs",
                    desc: "Serving ML models to the web securely and rapidly.",
                    color: "#33ffdd",
                    children: [
                      {
                        name: "Flask & FastAPI",
                        desc: "High-performance Python routing and inference serving.",
                        color: "#66ffee",
                      },
                      {
                        name: "Firebase",
                        desc: "Real-time backend-as-a-service and authentication.",
                        color: "#66ffee",
                      },
                    ],
                  },
                  {
                    name: "Frontend",
                    desc: "User-facing architecture and visualizations.",
                    color: "#33ffdd",
                    children: [
                      {
                        name: "WebDev",
                        desc: "HTML, CSS, JavaScript, and modern WebGL.",
                        color: "#66ffee",
                      },
                      {
                        name: "Streamlit",
                        desc: "Rapid dashboarding and data-app prototyping.",
                        color: "#66ffee",
                      },
                      {
                        name: "UI/UX",
                        desc: "Designing intuitive, cyberpunk-inspired user experiences.",
                        color: "#66ffee",
                      },
                    ],
                  },
                ],
              },
              {
                name: "DevOps & Cloud",
                desc: "The infrastructure. Scalability and version control.",
                color: "#ffaa00",
                children: [
                  {
                    name: "AWS",
                    desc: "Amazon Web Services. Cloud compute, S3, and scalable ML deployment.",
                    color: "#ffbb33",
                  },
                  {
                    name: "Docker",
                    desc: "Containerizing environments to ensure 'it works on my machine' works everywhere.",
                    color: "#ffbb33",
                  },
                  {
                    name: "Git",
                    desc: "Distributed version control and collaborative repository management.",
                    color: "#ffbb33",
                  },
                ],
              },
            ],
          },
          {
            name: "Non-Technical Skills",
            desc: "The human element. Strategy, leadership, and execution.",
            color: "#ffff00",
            children: [
              {
                name: "Communication",
                desc: "Translating complex mathematical concepts into clear business value for stakeholders.",
                color: "#ffff66",
              },
              {
                name: "Dedication",
                desc: "Relentless pursuit of optimization and seeing complex projects through to completion.",
                color: "#ffff66",
              },
              {
                name: "Problem Solving",
                desc: "Analytical mindset to break down seemingly impossible architectures into viable steps.",
                color: "#ffff66",
              },
              {
                name: "Cross-functional Leadership",
                desc: "Bridging the gap between Data Scientists, Backend Engineers, and Product Managers.",
                color: "#ffff66",
              },
              {
                name: "Agile Execution",
                desc: "Iterative development, sprint planning, and rapid prototyping in fast-paced environments.",
                color: "#ffff66",
              },
            ],
          },
        ],
      };

      // --- D3.js 2D TREE LOGIC ---

      const container = document.getElementById("tree-container");
      const width = container.clientWidth;
      const height = container.clientHeight;

      // Node sizing (vertical and horizontal spacing)
      const dy = width / 6; // Horizontal distance between levels
      const dx = 40; // Vertical distance between nodes
      const margin = { top: 20, right: 120, bottom: 20, left: 100 };

      // Initialize Zoom behavior
      const zoom = d3
        .zoom()
        .scaleExtent([0.3, 3])
        .on("zoom", (event) => {
          g.attr("transform", event.transform);
        });

      const svg = d3
        .select("#tree-container")
        .append("svg")
        .attr("width", width)
        .attr("height", height)
        .call(zoom)
        .on("click", () => {
          // Close terminal if clicking empty space
          document.getElementById("terminal-popup").classList.remove("visible");
        });

      const g = svg.append("g");

      // Center the root node on load
      const initialTransform = d3.zoomIdentity
        .translate(margin.left, height / 2)
        .scale(1);
      svg.call(zoom.transform, initialTransform);

      const tree = d3.tree().nodeSize([dx, dy]);
      const root = d3.hierarchy(treeData);

      root.x0 = 0;
      root.y0 = 0;

      // Collapse all nodes except the absolute root on initial load
      root.descendants().forEach((d, i) => {
        d.id = i;
        d._children = d.children; // Save children state
        if (
          d.depth &&
          d.name !== "Technical Skills" &&
          d.name !== "Non-Technical Skills"
        ) {
          d.children = null; // Collapse nodes deeper than level 1
        }
      });

      update(root);

      function update(source) {
        const duration = 500;
        const nodes = root.descendants().reverse();
        const links = root.links();

        // Compute the new tree layout
        tree(root);

        // Normalize for fixed-depth
        nodes.forEach((d) => {
          d.y = d.depth * dy;
        });

        // --- NODES ---
        const node = g.selectAll("g.node").data(nodes, (d) => d.id);

        // Enter any new nodes at the parent's previous position
        const nodeEnter = node
          .enter()
          .append("g")
          .attr("class", "node")
          .attr("transform", (d) => `translate(${source.y0},${source.x0})`)
          .on("click", (event, d) => {
            event.stopPropagation(); // Prevent background click from closing UI immediately

            // Toggle children
            if (d.children) {
              d._children = d.children;
              d.children = null;
            } else {
              d.children = d._children;
            }
            update(d);
            centerNode(d);
            updateTerminal(d);
          });

        // Add Circle
        nodeEnter
          .append("circle")
          .attr("r", 1e-6)
          .style("fill", (d) => (d._children ? d.data.color : "#010302"))
          .style("stroke", (d) => d.data.color);

        // Add Text labels
        nodeEnter
          .append("text")
          .attr("dy", ".35em")
          .attr("x", (d) => (d._children && !d.children ? -13 : 13)) // Left if closed, Right if open
          .attr("text-anchor", (d) =>
            d._children && !d.children ? "end" : "start",
          )
          .text((d) => d.data.name)
          .style("fill-opacity", 1e-6)
          .style("fill", (d) =>
            d.data.color === "#ffffff" ? "#ffffff" : "#e0e0e0",
          );

        const nodeUpdate = nodeEnter.merge(node);

        // Transition to the proper position for the node
        nodeUpdate
          .transition()
          .duration(duration)
          .attr("transform", (d) => `translate(${d.y},${d.x})`);

        // Update the node attributes and style
        nodeUpdate
          .select("circle")
          .attr("r", 6)
          .style("fill", (d) =>
            d._children && !d.children ? d.data.color : "#010302",
          )
          .style("stroke", (d) => d.data.color)
          .style("stroke-width", (d) =>
            d._children && !d.children ? "0px" : "2px",
          ); // Solid if closed, hollow if open

        nodeUpdate
          .select("text")
          .attr("x", (d) => (d._children && !d.children ? -13 : 13))
          .attr("text-anchor", (d) =>
            d._children && !d.children ? "end" : "start",
          )
          .style("fill-opacity", 1);

        // Remove exiting nodes
        const nodeExit = node
          .exit()
          .transition()
          .duration(duration)
          .attr("transform", (d) => `translate(${source.y},${source.x})`)
          .remove();

        nodeExit.select("circle").attr("r", 1e-6);
        nodeExit.select("text").style("fill-opacity", 1e-6);

        // --- LINKS ---
        const link = g.selectAll("path.link").data(links, (d) => d.target.id);

        // Enter any new links at the parent's previous position
        const linkEnter = link
          .enter()
          .insert("path", "g")
          .attr("class", "link")
          .style("stroke", (d) => d.target.data.color)
          .attr("d", (d) => {
            const o = { x: source.x0, y: source.y0 };
            return diagonal(o, o);
          });

        const linkUpdate = linkEnter.merge(link);

        // Transition back to the parent element position
        linkUpdate
          .transition()
          .duration(duration)
          .attr("d", (d) => diagonal(d.source, d.target));

        // Remove any exiting links
        link
          .exit()
          .transition()
          .duration(duration)
          .attr("d", (d) => {
            const o = { x: source.x, y: source.y };
            return diagonal(o, o);
          })
          .remove();

        // Store the old positions for transition
        nodes.forEach((d) => {
          d.x0 = d.x;
          d.y0 = d.y;
        });
      }

      // Smooth curved path generation
      function diagonal(s, d) {
        return `M ${s.y} ${s.x}
                C ${(s.y + d.y) / 2} ${s.x},
                  ${(s.y + d.y) / 2} ${d.x},
                  ${d.y} ${d.x}`;
      }

      // Smooth Camera Movement (Pan to center the clicked node)
      function centerNode(source) {
        const scale = d3.zoomTransform(svg.node()).k;
        let x = -source.y0;
        let y = -source.x0;

        // Offset slightly to the left so the expanded children appear in the center
        x = x * scale + width / 4;
        y = y * scale + height / 2;

        svg
          .transition()
          .duration(750)
          .call(zoom.transform, d3.zoomIdentity.translate(x, y).scale(scale));
      }

      function updateTerminal(d) {
        const terminal = document.getElementById("terminal-popup");
        document.getElementById("terminal-title").innerText =
          "> " + d.data.name;
        document.getElementById("terminal-desc").innerText = d.data.desc;

        terminal.style.borderColor = d.data.color;
        terminal.style.borderLeftColor = d.data.color;
        document.getElementById("terminal-title").style.color = d.data.color;
        document.getElementById("terminal-title").style.textShadow =
          `0 0 10px ${d.data.color}80`;

        terminal.classList.add("visible");
      }

      // Handle Window Resize properly
      window.addEventListener("resize", () => {
        const newWidth = container.clientWidth;
        const newHeight = container.clientHeight;
        svg.attr("width", newWidth).attr("height", newHeight);
      });
    </script>
  </body>
</html>
