    />

      rel="stylesheet"

    <!-- 3D Force Graph Library -->

    <style>
      :root {
        --bg: #010302;
        --text: #ffffff;
        --accent: #00ffcc;
      }
      body {
        margin: 0;
        background-color: var(--bg);
        color: var(--text);
        font-family: "Inter", sans-serif;
        overflow: hidden;
      }
      #3d-graph {
        width: 100vw;
        height: 100vh;
        cursor: crosshair;
        background: radial-gradient(circle at center, #05100a 0%, #000000 100%);
      }
      #3d-graph:active {
        cursor: grabbing;
      }

      .ui-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 2rem;
      }
      .ui-header,
      .ui-footer,
      #terminal-popup {
        pointer-events: auto;
      }

      h1 {
        font-family: "Courier New", monospace;
        color: var(--accent);
        font-size: clamp(1.2rem, 3vw, 2rem);
        text-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        margin: 0;
      }
      p.subtitle {
        font-family: "Courier New", monospace;
        color: #00aa44;
        margin-top: 0.5rem;
        font-size: clamp(0.8rem, 2vw, 1rem);
      }

      #terminal-popup {
        position: absolute;
        bottom: 2rem;
        right: 2rem;
        width: 400px;
        max-width: calc(100vw - 4rem);
        background: rgba(0, 10, 3, 0.9);
        border: 1px solid rgba(0, 255, 204, 0.4);
        border-left: 4px solid #ff0055;
        padding: 1.5rem;
        backdrop-filter: blur(12px);
        box-shadow: 0 0 30px rgba(0, 255, 204, 0.1);
        transform: translateY(150%);
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        font-family: "Courier New", monospace;
      }
      #terminal-popup.visible {
        transform: translateY(0);
      }
      #terminal-title {
        color: #ff0055;
        font-size: 1.4rem;
        font-weight: bold;
        margin-bottom: 0.5rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        text-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
      }
      #terminal-desc {
        color: #e0e0e0;
        font-size: 0.95rem;
        line-height: 1.5;
      }

      @media (max-width: 768px) {
        .ui-overlay {
          padding: 1rem;
        }
        #terminal-popup {
          bottom: 1rem;
          right: 1rem;
          width: calc(100vw - 2rem);
          max-width: none;
        }
      }
    </style>
  </head>

        >
          <i class="fas fa-arrow-left mr-2"></i>MAIN_FRAME
        </a>

      // --- GRAPH LOGIC ---
      const nodesById = {};
      const links = [];

      function traverseTree(node, parent = null) {
        const n = {
          id: node.id,
          desc: node.desc,
          color: node.color,
          val: node.val,
          // Initially show only the two main branches: Tech and Non-Tech
          collapsed: parent !== null && parent.id !== "Tanish Mittal",
          childLinks: [],
        };
        nodesById[node.id] = n;

        if (node.children) {
          node.children.forEach((child) => {
            traverseTree(child, n);
            const link = { source: n.id, target: child.id };
            n.childLinks.push(link);
          });
        }
      }

      traverseTree(rootData);

      function getPrunedTree() {
        const visibleNodes = [];
        const visibleLinks = [];

        function traverseVisible(nodeId) {
          const node = nodesById[nodeId];
          if (!node) return;
          visibleNodes.push(node);

          if (!node.collapsed && node.childLinks) {
            node.childLinks.forEach((link) => {
              visibleLinks.push(link);
              traverseVisible(link.target.id || link.target);
            });
          }
        }

        traverseVisible(rootData.id);
        return { nodes: visibleNodes, links: visibleLinks };
      }

      const elem = document.getElementById("3d-graph");
      const Graph = ForceGraph3D()(elem)
        .backgroundColor("rgba(0,0,0,0)")
        // Use Left-to-Right tree mode for a proper, structured "RPG Skill Tree" look
        .dagMode("lr")
        .dagLevelDistance(100)
        // INCREASE RIGIDITY to stop the "flying everywhere" wobble
        .d3Force(
          "collide",
          d3.forceCollide((node) => Math.cbrt(node.val) * 6),
        )
        .d3Force("charge", d3.forceManyBody().strength(-150)) // Push nodes apart strictly
        .nodeColor("color")
        .nodeRelSize(5)
        .nodeVal("val")
        .nodeLabel("id")
        .nodeResolution(16)
        .linkWidth(2.5)
        .linkColor(() => "rgba(255, 255, 255, 0.2)")
        .linkDirectionalParticles(2)
        .linkDirectionalParticleWidth(2)
        .linkDirectionalParticleSpeed(0.005)
        .onNodeClick((node) => {
          // Toggle collapse state
          if (node.childLinks.length > 0) {
            node.collapsed = !node.collapsed;
            Graph.graphData(getPrunedTree());
          }

          // Aim camera at node but keep the perspective clean
          const distance = 250;
          const distRatio = 1 + distance / Math.hypot(node.x, node.y, node.z);
          Graph.cameraPosition(
            {
              x: node.x * distRatio,
              y: node.y * distRatio,
              z: node.z * distRatio,
            },
            node,
            1500,
          );

          // Update UI Terminal
          const terminal = document.getElementById("terminal-popup");
          document.getElementById("terminal-title").innerText = "> " + node.id;
          document.getElementById("terminal-desc").innerText = node.desc;
          terminal.style.borderColor = node.color;
          terminal.style.borderLeftColor = node.color;
          document.getElementById("terminal-title").style.color = node.color;
          document.getElementById("terminal-title").style.textShadow =
            `0 0 10px ${node.color}80`;

          terminal.classList.add("visible");
        });

      // Render the structured tree
      Graph.graphData(getPrunedTree());

      // Remove the auto-spin completely so it remains a rigid, readable skill tree
      // Set initial camera position to look at the whole tree from the side
      setTimeout(() => {
        Graph.cameraPosition({ x: 0, y: 0, z: 600 });
      }, 500);

      window.addEventListener("resize", () => {
        Graph.width(window.innerWidth);
        Graph.height(window.innerHeight);
      });

      Graph.onBackgroundClick(() => {
        document.getElementById("terminal-popup").classList.remove("visible");
      });
